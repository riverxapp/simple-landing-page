<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Riverx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --accent: #2563eb;
      --text: #111111;
      --muted: #555555;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      max-width: 64rem;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      font-weight: 800;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo svg {
      width: 1.5rem;
      height: 1.5rem;
      color: var(--accent);
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.95rem;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      color: var(--text);
    }

    main {
      flex: 1;
      width: min(32rem, calc(100vw - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input,
    textarea {
      font: inherit;
      padding: 0.7rem 0.9rem;
      border: 1px solid #dddddd;
      border-radius: 0.5rem;
      background: #ffffff;
      color: var(--text);
    }

    input:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 8rem;
    }

    button {
      font: inherit;
      font-weight: 600;
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      justify-self: start;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3L4 7V12C4 17 7.4 20.9 12 22C16.6 20.9 20 17 20 12V7L12 3Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9.5 12L11.25 13.75L15 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Riverx
    </a>
    <nav>
      <a href="/#features">Features</a>
      <a href="#">Pricing</a>
      <a href="/contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact us</h1>
    <p class="lead">Questions, feedback, or a project in mind? Send us a message and we'll get back to you.</p>
    <form action="mailto:hello@riverx.example" method="post" enctype="text/plain">
      <label>
        Name
        <input type="text" name="name" required autocomplete="name" />
      </label>
      <label>
        Email
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>
        Message
        <textarea name="message" required></textarea>
      </label>
      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>© 2026 Riverx. All rights reserved.</footer>
</body>
</html>
